name: "Bug Report"
description: "Signaler un bug dans appDesk"
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Description du bug"
      placeholder: "Décris clairement le problème rencontré."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Étapes pour reproduire"
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Comportement attendu"
      placeholder: "Ce qui aurait dû se passer."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs / erreurs"
      placeholder: "Stacktrace, messages d’erreur…"
      render: bash

  - type: input
    id: version
    attributes:
      label: "Version appDesk"
      placeholder: "ex: v1.0.0"
