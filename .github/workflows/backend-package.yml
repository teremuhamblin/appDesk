name: Publish Backend Package

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (match Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpq-dev \
            libmagic1 \
            libssl-dev \
            libffi-dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Package
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/appdesk-backend:latest
            ghcr.io/${{ github.repository_owner }}/appdesk-backend:${{ github.ref_name }}

      - name: Backend sanity check (Django)
        run: |
          cd Backend
          pip install --upgrade pip
          pip install -r requirements.txt
          python src/manage.py check
